name: Build Luma desktop
on:
  push:
    branches: [main, codex/luma-verge-rebuild]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: mac
            arch: x64
            target: x86_64-apple-darwin
          - runner: windows-latest
            platform: win
            arch: x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      HUSKY: '0'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-luma-0.3-native
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: node build/luma/prepare.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Core forwarding regression
        shell: bash
        run: python build/luma/forwarding-smoke.py "$(find src-tauri/sidecar -type f -name 'luma-mihomo-*' | head -1)"
      - name: Frontend checks
        run: |
          pnpm typecheck
          pnpm test
      - name: Rust tests
        run: cargo test -p luma --lib --features clippy --locked
      - name: Build native application
        run: pnpm exec tauri build --target ${{ matrix.target }} -- --locked
      - name: Native app lifecycle regression
        if: matrix.platform == 'mac'
        run: python3 build/luma/native-smoke.py "target/${{ matrix.target }}/release/bundle/macos/Luma.app"
      - name: Package macOS
        if: matrix.platform == 'mac'
        run: node build/luma/build-mac-installer.mjs "target/${{ matrix.target }}/release/bundle/macos/Luma.app"
      - name: Collect Windows installer
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/0.3.0
          Copy-Item target/${{ matrix.target }}/release/bundle/nsis/*.exe release/0.3.0/Luma-0.3.0-win-x64.exe
          $hash = (Get-FileHash release/0.3.0/Luma-0.3.0-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Luma-0.3.0-win-x64.exe" | Out-File -Encoding ascii release/0.3.0/Luma-0.3.0-win-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/**/*.pkg
            release/**/*.exe
            release/**/*.sha256
          if-no-files-found: error
          retention-days: 14
  format-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Produce formatting review
        run: |
          cargo fmt --all
          mkdir -p artifacts
          git diff --binary > artifacts/rust-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: Rust-format-review
          path: artifacts/rust-format.patch
          retention-days: 7
